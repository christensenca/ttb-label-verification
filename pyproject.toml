[project]
name = "ttb-label-verify"
version = "0.1.0"
description = "AI-powered TTB alcohol label verification prototype"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pillow>=10.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
